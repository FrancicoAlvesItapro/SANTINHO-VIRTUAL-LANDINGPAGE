<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Mobile - Santinho Virtual</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f9fafb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(30, 41, 59, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            max-width: 400px;
        }
        h2 {
            color: #f59e0b;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        p {
            color: #d1d5db;
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .qr-wrapper {
            background: white;
            padding: 16px;
            border-radius: 16px;
            display: inline-block;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            margin-bottom: 20px;
        }
        img {
            display: block;
        }
        .link-text {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            display: block;
            margin-top: 10px;
        }
        .link-text:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Visualizar no Celular</h2>
        <p>Aponte a câmera do seu celular para o QR Code abaixo para abrir a página local diretamente no seu aparelho:</p>
        
        <div class="qr-wrapper">
            <!-- QR Code generated automatically targeting the computer's network IP address -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=http://192.168.1.12:3000" alt="QR Code para Celular">
        </div>
        
        <p>Ou digite no navegador do celular:</p>
        <a href="http://192.168.1.12:3000" target="_blank" class="link-text">http://192.168.1.12:3000</a>
    </div>
</body>
</html>
